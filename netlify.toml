[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "max-age=31536000,public,must-revalidate"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "max-age=31536000,public,must-revalidate"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "max-age=31536000,public,must-revalidate"

[[headers]]
